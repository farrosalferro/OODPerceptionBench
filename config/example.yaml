# OOD-PerceptionBench — machine configuration template
#
# Copy this to config/<your-machine>.yaml, replace every <...> placeholder, and pass it as
# --config:
#
#     python runner/run_benchmark.py --config config/<your-machine>.yaml --dry-run
#
# It holds what every machine must supply, plus the protocol settings that keep your numbers
# comparable to the published baselines. Every other field, with its default and what it does,
# is documented in runner/configs/example.yaml; the format is the same, so any section of that
# file can be copied in here. No path has a working default: a missing required field stops the
# runner with an error that names it, rather than falling back to somebody else's filesystem.
#
# Version stamp: 0.9.0 (arXiv v1). YAML needs PyYAML in the Python that runs the runner.

version: 1

# --- Protocol ----------------------------------------------------------------
# Do not change these if you want numbers comparable to the published baselines: base seed 42,
# three repetitions -> seeds 42, 43, 44. (PDM-Lite, the ceiling, is published at seed 42 only.)
benchmark:
  release: v0.9
  arxiv_version: v1
  seed: 42
  repetitions: 3

# --- Simulator ---------------------------------------------------------------
# The directory that holds CarlaUE4.sh. CARLA 0.9.15 exactly, with AdditionalMaps_0.9.15 and
# the content pack installed (assets/INSTALL.md); other versions fail silently, not loudly.
carla:
  root: <path-to-carla-0.9.15>

# --- Patched harness ---------------------------------------------------------
# Inside the checkout setup.sh patched (the directory you gave --upstream-dir). work_dir is its
# Bench2Drive/ directory, NOT the checkout root: the evaluator reads
# <work_dir>/leaderboard/data/weather.xml on every route.
leaderboard:
  work_dir: <path-to-carla_garage-checkout>/Bench2Drive
  root: <path-to-carla_garage-checkout>/Bench2Drive/leaderboard
  scenario_runner_root: <path-to-carla_garage-checkout>/Bench2Drive/scenario_runner

# --- Agent -------------------------------------------------------------------
agent:
  # A Python file exposing get_entry_point() -> the name of your AutonomousAgent subclass.
  entrypoint: <path-to-your-agent>.py
  config: ""        # handed to your agent's setup(); leave "" if it reads none
  track: SENSORS    # SENSORS | MAP

# --- Environment the agent runs in -------------------------------------------
environment:
  # Shell lines that activate it, run before every route, e.g.
  #   activate: ["source /opt/conda/etc/profile.d/conda.sh", "conda activate my-env"]
  activate: []
  # The ABSOLUTE path to that environment's interpreter, never a bare `python3`: it is what
  # every route runs, whatever PATH holds after activation.
  python: <absolute-path-to-your-environment>/bin/python3

# --- Compute -----------------------------------------------------------------
execution:
  backend: local    # local | slurm (for slurm, copy the slurm: section of runner/configs/example.yaml)
  workers: 1        # concurrent routes; each gets its own CARLA server and GPU

# One entry per GPU the pool may use. CUDA and Vulkan number devices independently, and CARLA
# renders with Vulkan: run `python runner/run_benchmark.py --check-gpus` to learn the pairs.
gpus:
  - {cuda: 0, vulkan: 0}

# --- Output and routes -------------------------------------------------------
output:
  root: <path-to-output-dir>

routes:
  # The 475 canonical routes shipped in this repository, checked against their manifest.
  root: <path-to-this-repo>/routes
  manifest: <path-to-this-repo>/routes/MANIFEST.tsv
  strict_manifest: true
